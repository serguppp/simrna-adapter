[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simrna-adapter"
version = "0.1.0"
description = "Run separately licensed SimRNA 3.20 in zero-iteration scoring mode"
requires-python = ">=3.11"
dependencies = ["gemmi>=0.7,<0.8"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.15"]

[project.scripts]
simrna-score = "simrna_adapter.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "gemmi"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
